[project]
name = "football-shot-models"
version = "0.1.0"
description = "Shot models for football: expected goals (xG), post-shot xG (xGOT/PSxG) and goalkeeper shot-stopping"
readme = "README.md"
license = "MIT"
authors = [
    { name = "R. Berk Karataş", email = "rberkk@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "football-core[viz]",
    "scikit-learn>=1.9.1",
]

[tool.uv.sources]
football-core = { path = "../football-core", editable = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# football_shot_charts sits outside the prediction cache's hash (render-only, PM CH1 E3)
module-name = ["football_shot_models", "football_shot_charts"]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
    "threadpoolctl>=3.7.0",
]
docs = [
    "mkdocstrings[python]>=1.0.0",
    "nbconvert>=7.16.0",
    "zensical==0.0.72",  # alpha: pinned exactly, bump deliberately
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "scipy", "scipy.*"]  # neither ships a py.typed
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules -m 'not slow'"
markers = [
    "slow: needs the real snapshot; run with make reproduce",
    "whoscored: needs the private WhoScored snapshot and v0",
]

# The home page's headline results (docs/index.md, results block): rows and columns copied by
# football_docs.pages from the README's generated card blocks; `make docs-results` rewrites it.
[[tool.football_docs.results]]
result = "xG, monotone GBM + Platt trained without team-selected seasons, StatsBomb open data: log loss"
block = "models"
row = ["Monotone GBM + Platt, trained without team-selected seasons"]
columns = ["CV log loss", "Hold-out log loss"]

[[tool.football_docs.results]]
result = "StatsBomb's own xG on the same shots: log loss"
block = "models"
row = ["StatsBomb xG"]
columns = ["CV log loss", "Hold-out log loss"]

[[tool.football_docs.results]]
result = "xG v1, monotone GBM + Platt, private WhoScored / Opta archive: log loss"
block = "v1"
row = ["Monotone GBM + Platt"]
columns = ["CV log loss", "Test log loss"]

[[tool.football_docs.results]]
result = "xGOT, monotone GBM + Platt, StatsBomb open data: AUC"
block = "xgot"
row = ["StatsBomb open data", "Monotone GBM + Platt"]
columns = ["CV AUC", "Hold-out / test AUC"]

[[tool.football_docs.results]]
result = "xGOT, monotone GBM + Platt, private WhoScored / Opta archive: AUC"
block = "xgot"
row = ["private WhoScored / Opta event archive", "Monotone GBM + Platt"]
columns = ["CV AUC", "Hold-out / test AUC"]

[[tool.football_docs.results]]
result = "Keeper model, StatsBomb open data: next-season log-loss gain of the shrunken keeper estimates"
block = "gsax"
row = ["StatsBomb open data"]
columns = ["Next season: gain over raw", "Gain over xGOT alone"]
notes = ["StatsBomb open data: Shrunken", "Without team-selected"]

[[tool.football_docs.results]]
result = "Keeper model, private WhoScored / Opta archive: next-season log-loss gain of the shrunken keeper estimates"
block = "gsax"
row = ["private WhoScored / Opta event archive"]
columns = ["Next season: gain over raw", "Gain over xGOT alone"]
notes = ["private WhoScored / Opta event archive: Shrunken"]
