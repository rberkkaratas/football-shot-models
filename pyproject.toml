[project]
name = "football-shot-models"
version = "0.1.0"
description = "Shot models for football: expected goals (xG), post-shot xG (xGOT/PSxG) and goalkeeper shot-stopping"
readme = "README.md"
license = "MIT"
authors = [
    { name = "R.Berk Karatas", email = "rberkk@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "football-core",
    "scikit-learn>=1.9.1",
]

[tool.uv.sources]
football-core = { path = "../football-core", editable = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]
docs = [
    "mkdocstrings[python]>=1.0.0",
    "nbconvert>=7.16.0",
    "zensical==0.0.72",  # alpha: pinned exactly, bump deliberately
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]  # scikit-learn ships no py.typed
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules -m 'not slow'"
markers = ["slow: needs the real snapshot; run with make reproduce"]
