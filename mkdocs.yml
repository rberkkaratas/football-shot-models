site_name: football-shot-models
site_description: "Shot models for football: expected goals (xG), post-shot xG (xGOT/PSxG) and goalkeeper shot-stopping"
site_author: R. Berk Karataş
copyright: © 2026 R. Berk Karataş · MIT licence
docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            extensions: [football_docs.roles]
            show_root_heading: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - stylesheets/theme.css
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css

nav:
  - Home: index.md
  - Charts: charts.md
  - Data: data.md
  - Methodology: methodology.md
  - Model cards:
      - "Base rate": models/xg-base-rate.md
      - "LR distance + angle": models/xg-lr-distance-angle.md
      - "LR distance + angle + body part": models/xg-lr-distance-angle-body-part.md
      - "LR splines + body part": models/xg-lr-splines.md
      - "LR splines + context": models/xg-lr-context.md
      - "LR splines + context + freeze frames": models/xg-lr-frames.md
      - "Monotone GBM + Platt": models/xg-gbm.md
      - "Penalty conversion (Beta-binomial)": models/xg-penalty.md
      - "xG v1 (WhoScored / Opta events)": models/xg-v1.md
      - "xG v2, pre-shot context (WhoScored / Opta)": models/xg-v2.md
      - "xGOT LR (StatsBomb)": models/xgot-lr.md
      - "xGOT monotone GBM (StatsBomb)": models/xgot-gbm.md
      - "Penalty xGOT (StatsBomb)": models/xgot-penalty.md
      - "xGOT LR (WhoScored / Opta)": models/ws-xgot-lr.md
      - "xGOT monotone GBM (WhoScored / Opta)": models/ws-xgot-gbm.md
      - "Penalty xGOT (WhoScored / Opta)": models/ws-xgot-penalty.md
      - "GSAx (StatsBomb)": models/gsax.md
      - "Keeper model (StatsBomb)": models/gk-model.md
      - "GSAx (WhoScored / Opta)": models/ws-gsax.md
      - "Keeper model (WhoScored / Opta)": models/ws-gk-model.md
      - "Model card template": model-card-template.md
  - Modules: modules.md
  - Roadmap: roadmap.md
  - References: references.md
  - API reference:
