# Build the documentation site (strict Zensical build plus the raw-role check of `make docs`) and
# publish it with GitHub Pages. Needs Settings > Pages > Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: football-shot-models
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: football-shot-models
          persist-credentials: false
      # Stopgap: [tool.uv.sources] reads football-core from the path ../football-core, so core is
      # checked out beside this repo. When that source becomes a git dependency, delete this step.
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/football-core
          path: football-core
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.16"
          python-version: "3.12.13"
          working-directory: football-shot-models
      - run: uv sync --locked --all-groups
      - run: make docs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: football-shot-models/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
